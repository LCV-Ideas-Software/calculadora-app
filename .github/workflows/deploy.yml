name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--no-deprecation"
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  deploy:
    name: Validate and deploy application
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Verify npm registry
        shell: bash
        run: test "$(npm config get registry)" = "https://registry.npmjs.org/"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run biome
      - run: npm test
      - run: npm run build
      - name: Build exact Pages Functions artifact
        run: |
          test ! -e dist/_worker.js
          test ! -e dist/_routes.json
          mkdir -p .wrangler/pages-custody
          npm exec -- wrangler pages functions build functions --outdir=dist/_worker.js --metafile=.wrangler/pages-custody/metafile.json --output-config-path=.wrangler/pages-custody/functions-config.json --output-routes-path=dist/_routes.json --build-output-directory=dist --project-directory=.
          test -s dist/_worker.js/index.js
          test -s dist/_routes.json
          test -s .wrangler/pages-custody/metafile.json
          test -s .wrangler/pages-custody/functions-config.json
          test ! -e dist/functions
          # Wrangler emits build metadata only for a configured Pages output; this project has no Wrangler config.

      - name: Preserve exact Pages deployment inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist
            .wrangler/pages-custody
            package-lock.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          # Advanced Mode uses the preserved worker and routes from dist; source Functions are not rebuilt.
          # Filepath dashboard metadata stays in the private artifact; runtime routing is compiled into the worker.
          command: pages deploy . --cwd dist --no-bundle --project-name=calculadora-app --branch=main
    timeout-minutes: 30
